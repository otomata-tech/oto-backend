name: Deploy preprod

# Modèle de release (ADR 0020, refonte 2026-07-20) : push sur `main` → PREPROD.
# `main` est la branche de tronc ; tout merge/push y déploie l'environnement staging
# (checkout /opt/oto-mcp-canari, service oto-mcp-canari, endpoint mcp-canari.oto.ninja,
# base chiffrée oto_canari — l'ancien « canari » de l'ADR 0040, désormais alimenté par
# main). La PROD ne se déploie QUE sur un tag `v*` (deploy.yml). La logique serveur
# (reset origin/main + reinstall oto-core au tag + restart + healthcheck + rollback)
# vit dans /opt/deploy/oto-backend-canari.sh — source de vérité unique.
# Le job `test` tourne aussi sur PR vers main (= le check de validation avant merge).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Chaque job porte un `timeout-minutes` : sans lui, le défaut de GitHub est de SIX
  # heures. Ce workflow part à chaque poussée sur le tronc ET à chaque PR — c'est le
  # plus exécuté du dépôt — et RIEN ne rattrape un job suspendu : il n'y a aucun
  # `concurrency` de workflow, donc pas d'annulation du run précédent, et les runs
  # suspendus s'empilent en parallèle. Pire pour les deux jobs auto-hébergés : le parc
  # ne compte qu'UN runner `oto-platform`, celui dont la PROD a besoin (deploy.yml) ;
  # et `deploy-preprod` sérialise sur un groupe `cancel-in-progress: false`, donc une
  # suspension y met tous les déploiements suivants en file derrière elle.
  # Plafonds calés sur 60 runs terminés (05→07/09/2026), durée d'exécution maximale
  # observée par job — rappelée devant chaque valeur. Le 07/09, un job de tests s'est
  # suspendu 45 min sans écrire une ligne, jusqu'à une annulation à la main.

  # La syntaxe est vérifiée sur le Python du SERVEUR, pas sur celui de la CI.
  # Le 27/08, un boot preprod est mort sur « f-string expression part cannot include
  # a backslash » : légal en 3.12 (CI) et en 3.13 (poste), SyntaxError en 3.10 (box).
  # Ni les tests ni la CI ne pouvaient le voir — les deux tournaient sur un Python
  # plus récent que ce qui sert. `ast.parse(feature_version=(3,10))` ne l'attrape pas
  # non plus (vérifié : PEP 701 a changé le tokenizer, le drapeau ne le restaure pas),
  # donc il FAUT un vrai interpréteur 3.10. `compileall` suffit et coûte ~15 s : on ne
  # rejoue pas la suite, on vérifie que ça se COMPILE là où ça tournera.
  syntaxe-plancher:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # max observé 9 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # DOIT rester égal au `requires-python` du pyproject ET à la box.
          python-version: "3.10"
      - name: Compiler sous le Python le plus ancien supporté
        run: python -m compileall -q oto_mcp

  # ─────────────────────────────────────────────────────────────────────────────
  # UNE RÉFÉRENCE POUSSÉE SANS SON OBJET.
  #
  # Le 02/09/2026, `oto_mcp/billing.py` importait `billing_grants` : l'import était
  # dans le commit, le fichier n'y était pas — il n'existait que sur le disque de son
  # auteur. Toute la suite échouait à la COLLECTE (pas quelques tests : tous), la
  # préproduction était sautée, et plus rien ne pouvait partir en production.
  #
  # ⚠️ Cette classe est INVISIBLE POUR SON AUTEUR et visible pour tous les autres :
  # son répertoire de travail complète le commit, donc chez lui tout s'importe. Deux
  # sessions ont mesuré en même temps et conclu l'inverse, chacune ayant raison sur ce
  # qu'elle regardait. Et elle naît d'une BONNE pratique — le staging sélectif, imposé
  # parce que plusieurs sessions écrivent dans le même checkout : rien, au moment du
  # commit, ne dit qu'on vient de pousser un import sans son fichier.
  #
  # Ce job ne juge donc jamais un répertoire de travail. Le script extrait l'arbre
  # depuis git (`git archive`) dans un emplacement neuf, l'importe DE LÀ, et vérifie
  # pour chaque module que ce qui vient d'entrer dans `sys.modules` sort bien de cet
  # arbre — la première version du script se contentait de `sys.path`, et le chercheur
  # de l'installation éditable résolvait le fichier manquant depuis le checkout de
  # l'auteur : le garde-fou sortait VERT sur le commit même qui avait cassé le tronc.
  #
  # PROFONDEUR — tous les modules, pas seulement la racine du serveur. Mesuré :
  # importer `oto_mcp.server` en charge 554 sur 590 et coûte 2,7 s ; monter à 590 coûte
  # 3,3 s. La profondeur complète est donc gratuite, et les 36 modules que la racine
  # n'atteint pas sont précisément ceux où une référence sans objet dort jusqu'au
  # runtime, sans que rien ne la révèle avant la production.
  #
  # OÙ — sur les PR *ET* sur le tronc, délibérément : le commit qui a cassé le tronc
  # n'est passé par aucune PR. Sur une PR, `actions/checkout` donne le commit de
  # FUSION, donc ce job juge l'arbre qui atterrirait — ce qui couvre aussi le cas où
  # l'un ajoute la référence pendant que l'autre déplace le fichier.
  #
  # COÛT — nul sur le chemin critique : `test` tient la chaîne à ~6 min 40, ce job
  # tourne en parallèle et rend son verdict en ~1 min. Il n'a délibérément PAS été
  # fondu dans une étape de `test` : une ligne de check distincte est observable (un
  # job absent de la liste n'est pas un job vert), et un rouge caché dans `test` se
  # lirait « des tests échouent » — exactement la confusion qu'on retire ici.
  arbre-importable:
    name: L'arbre poussé s'importe
    runs-on: ubuntu-latest
    timeout-minutes: 10  # max observé 1 min 13 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dépendances de RUNTIME seulement (pas l'extra `dev`) : ce que le serveur
      # importe au boot ne doit rien devoir à l'outillage de test. Si l'installation
      # échoue, l'étape échoue et le job est ROUGE — jamais un « je n'ai rien pu
      # juger » déguisé en succès.
      - name: Install (dépendances de runtime, par le verrou)
        uses: ./.github/actions/installer-par-le-verrou
        with:
          # Le même que `test`, dont l'installation est éprouvée. Ce job répond à UNE
          # question — « l'arbre poussé s'importe-t-il ? » — et n'endosse pas en plus
          # celle du plancher de version, que `syntaxe-plancher` couvre déjà en 3.10.
          python-version: "3.12"
      - name: Importer l'arbre du commit, extrait de git
        run: python scripts/arbre-importable.py

  # ─────────────────────────────────────────────────────────────────────────────
  # CE QUE CE PUSH JOUE (#1185, décision du 08/10/2026).
  #
  # La suite complète (~20 000 tests, 9 à 13 min) ne tourne plus qu'au TAG, une seule fois,
  # avant la prod (`deploy.yml`). Ici, `test` ne joue que les volets touchés par le diff,
  # PLUS le socle de gardes transverses — c'est lui qui couvre les rouges nés loin du fichier
  # modifié (constat de #1111). Table et règles : `tests/volets.toml` ; le script dit dans le
  # résumé du run ce qu'il a retenu et pourquoi.
  #
  # Base du diff : `before` au push (un push peut porter plusieurs commits ; le parent seul
  # n'en verrait qu'un), la base de la PR sur une PR. Base inconnue (nouvelle branche,
  # poussée forcée), fichier hors volet, relance manuelle : `cible` est VIDE, donc suite
  # complète. Jamais l'inverse : un script qui échoue fait échouer le job, et `test` avec.
  selection:
    name: Ce que ce push joue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cible: ${{ steps.selection.outputs.cible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # la base du diff doit être dans l'historique
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: selection
        name: Volets touchés + socle
        env:
          # Passés par l'environnement, jamais interpolés dans le script.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          TETE: ${{ github.sha }}
        run: python3 scripts/selection_tests.py --base "$BASE" --tete "$TETE"

  # LA SÉLECTION DU PUSH, RÉPARTIE EN PARTS PARALLÈLES (#1111) : `suite-tests.yml`. La
  # répartition par durée mesurée, le `-n` dérivé de la mémoire de CHAQUE machine (leçon de
  # l'OOM du 07/09), `OTO_TEST_PG_PLACES`, `--dist loadgroup` (#963) et l'agrégateur qui
  # refuse un test perdu y vivent, avec leur histoire. `cible` vide = la suite complète.
  suite:
    needs: [selection]
    uses: ./.github/workflows/suite-tests.yml
    with:
      cible: ${{ needs.selection.outputs.cible }}

  # LE NOM `test` EST UN CONTRAT. La garde de mise en production
  # (`scripts/garde_preprod_verte.py`) exige un job nommé EXACTEMENT `test` qui conclut
  # `success` ; or un job appelé par `uses:` s'affiche « suite / <job interne> », jamais
  # `test`. Ce job porte donc le nom, et ne conclut `success` que si la suite entière a
  # conclu `success`. `always()` : il tourne aussi quand la suite a rougi ou a été sautée,
  # pour le DIRE en rouge au lieu d'apparaître `skipped` — un job sauté ne rend pas un run
  # rouge, c'est exactement le trou que la garde ferme.
  test:
    needs: [suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La suite a conclu « success »
        env:
          RESULTAT: ${{ needs.suite.result }}
        run: |
          if [ "$RESULTAT" != success ]; then
            echo "::error title=Suite de tests : $RESULTAT::suite-tests.yml conclut « $RESULTAT » — le détail est dans ses jobs (suite / …)."
            exit 1
          fi
          echo "suite-tests.yml : success"

  # ─────────────────────────────────────────────────────────────────────────────
  # CE QUE PÈSE UNE COLLECTE, SUR LA MACHINE QUI L'EXÉCUTE.
  #
  # Le 07/09, quatre workers figés — calibrés sur un poste à 28 cœurs — ont fait tuer
  # `pytest` par l'OOM killer sept fois de suite sur un runner 4 vCPU / 16 Go, tronc
  # rouge six heures. La leçon inscrite dans le revert est qu'un nombre de workers se
  # dérive de la MÉMOIRE de la machine qui exécute. Sauf que cette règle était
  # inapplicable : personne n'avait jamais mesuré ce que pèse une collecte, et le
  # cadre de l'OOM lui-même est une déduction depuis la mort, pas une mesure.
  #
  # Ce job produit ce chiffre. Il ne règle rien et ne décide rien.
  #
  # ⚠️ `continue-on-error` N'EST PAS UNE PRÉCAUTION DE STYLE. Depuis le 08/09, la garde
  # de mise en production exige que le run de préproduction de ce sha conclue
  # `success` : un job qui échoue ici bloquerait une release. Un instrument ne doit
  # jamais pouvoir faire ça. D'où la double ceinture — ce drapeau, ET un script qui ne
  # sort jamais en échec. Il ne gate rien non plus : `deploy-preprod` ne l'attend pas,
  # il tourne en parallèle de `test` (~9 min) et ne coûte donc aucune seconde de mur.
  empreinte-collecte:
    name: Ce que pèse une collecte
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install (deps + dev, par le verrou)
        uses: ./.github/actions/installer-par-le-verrou
        with:
          # Le même que `test` : on mesure ce que `test` paie, pas autre chose.
          python-version: "3.12"
          extra: dev
      - name: Mesurer
        # Le relevé va AUSSI dans le résumé du run : un chiffre qu'il faut déplier un
        # journal pour lire n'est pas lu.
        run: |
          {
            echo '```'
            python scripts/empreinte_collecte.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # LA GARDE S'EXÉCUTE SOUS LE PLANCHER PYTHON.
  #
  # Le 21/09/2026, #1039 lisait `code.co_qualname` (Python 3.11+) : la prod tourne en 3.10,
  # `AttributeError` à chaque accès base depuis la boucle, revert en 3 min. `test` (3.12)
  # était vert ; `syntaxe-plancher` compile en 3.10 mais n'EXÉCUTE rien, et un attribut
  # absent n'est pas de la syntaxe. Ce job exécute, sous l'interpréteur de la box, ce qui a
  # cassé : l'import complet de l'arbre et les bancs de la garde d'exécution.
  #
  # COÛT — ~1 min 30 hors chemin critique (parallèle à `test`, ~7 min) : install runtime + dev
  # (sans le bac à sable ni les bancs Postgres : aucun n'est requis par ces fichiers).
  # Ce n'est PAS la suite entière en 3.10 : elle coûterait un second `test` de ~7 min.
  # Un défaut 3.11+ ailleurs, hors de ce périmètre, reste possible : quand il se produit,
  # ajouter ici le banc qui l'aurait vu.
  garde-plancher-python:
    name: La garde s'exécute sous le plancher Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Le verrou installé sous l'interpréteur de la box : c'est aussi la preuve, à
      # chaque poussée, que `uv sync --frozen` du déploiement passe en 3.10.
      - name: Install (deps + dev, par le verrou)
        uses: ./.github/actions/installer-par-le-verrou
        with:
          # DOIT rester égal au `requires-python` du pyproject ET à la box
          # (comme `syntaxe-plancher` de deploy.yml).
          python-version: "3.10"
          extra: dev
      - name: Importer l'arbre du commit sous 3.10
        run: python scripts/arbre-importable.py
      - name: Bancs de la garde d'exécution sous 3.10
        run: pytest -q tests/test_db_hors_boucle.py tests/test_lot1_sql_hors_boucle.py

  deploy-preprod:
    needs: [test, syntaxe-plancher, arbre-importable, garde-plancher-python, contrat-front-code]
    # push main OU relance manuelle (workflow_dispatch depuis main) — un dispatch
    # qui ne faisait que les tests laissait croire à un déploiement (vécu 23/07 :
    # canari resté en arrière après un push failed, dispatch « success » sans effet).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, oto-platform]
    # max observé 1 min 16 s ; la marge couvre restart + healthcheck + rollback.
    timeout-minutes: 15
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    steps:
      - name: Deploy preprod (build serveur via script root-restreint)
        # oto-backend#948 (14/09/2026) : sans argument, le script installait
        # `origin/main` — la POINTE du tronc au moment où il s'exécute, pas le sha
        # que CE run vient de valider. Entre le début du run et son `deploy-preprod`
        # (`needs: test`), d'autres commits peuvent arriver sur main ; le déploiement
        # servait alors un sha dont AUCUNE CI n'avait été vue verte — 3 occurrences
        # mesurées le 14/09. Préprod et prod partagent la même base : un DDL ou une
        # semence non vérifiés s'y jouaient au boot. `github.sha` fige ce que ce run
        # a réellement testé.
        run: sudo /opt/deploy/oto-backend-canari.sh ${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # LES CONSOMMATEURS DÉCLARÉS DE NOTRE API (#966).
  #
  # Un front (le dashboard) ou un service (le commerce) épingle dans SON
  # dépôt ce qu'il appelle et lit de notre OpenAPI. Les deux jobs de contrat ci-dessous
  # confrontent CHAQUE contrat épinglé à ce que nous servons : celui qui casse l'apprend
  # le premier, ici, et non le lendemain dans le travail de quelqu'un d'autre (mesuré le
  # 31/08/2026 : deux blocages de livraison chez un front tiers dans la journée, pour
  # des changements venus de nous).
  #
  # La liste vit dans `.github/contrat-consommateurs.json` : nom, dépôt, chemin du
  # contrat, secret de lecture (`null` = dépôt public, lu sans clé). Jusqu'au 25/09 ce
  # mécanisme était écrit au singulier — un dépôt, un chemin, un secret en dur : un
  # second consommateur aurait été INVISIBLE, jamais lu ni jugé, et on se serait cru
  # gardé. Déclarer un consommateur, c'est ajouter une entrée ; rien d'autre.
  #
  # Chaque consommateur est jugé dans sa propre jambe (`fail-fast: false`) : un rouge
  # sur l'un n'empêche pas de juger les autres, et chaque verdict le NOMME.
  #
  # ⚠️ Un retrait d'ancienne forme n'a pas de délai fixe (Alexis, 25/09) : il part quand
  # tous les consommateurs déclarés ont suivi — et c'est ce contrôle qui le constate.
  consommateurs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: liste
        run: |
          set -euo pipefail
          # La liste se lit dans le dépôt, donc une PR peut la modifier : chaque champ est
          # vérifié contre une forme stricte AVANT de devenir une matrice.
          if ! jq -e 'type == "array" and length > 0 and all(.[];
                 (.nom | test("^[A-Za-z0-9._-]+$")) and
                 (.depot | test("^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")) and
                 (.chemin | test("^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$")) and
                 (.secret == null or (.secret | test("^[A-Z][A-Z0-9_]*$"))))' \
               .github/contrat-consommateurs.json > /dev/null; then
            echo "::error title=Liste des consommateurs refusée::.github/contrat-consommateurs.json ne respecte pas la forme attendue (nom, dépôt owner/repo, chemin relatif, secret en MAJUSCULES ou null) — aucun contrat n'est jugé."
            exit 1
          fi
          echo "liste=$(jq -c . .github/contrat-consommateurs.json)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # APRÈS la préproduction : ce qui est réellement SERVI. Un constat, pas une garde —
  # un déploiement peut servir autre chose que ce que le code annonce.
  #
  # Il ne rougit QUE si les appels ou les lectures d'un consommateur cassent (opération
  # disparue, entrée modifiée, champ lu retiré). Les écarts sans effet sortent en
  # avertissement : un contrôle qui crie pour tout cesse d'être lu. Et il ne rougit
  # JAMAIS pour un geste venu du consommateur — contrat déplacé, dépôt inaccessible :
  # avertissement, avec le chemin cherché nommé (`scripts/lire-contrat-consommateur.sh`).
  contrat-front:
    name: Contrat servi — ${{ matrix.consommateur.nom }}
    needs: [deploy-preprod, consommateurs]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, oto-platform]
    strategy:
      fail-fast: false
      # Un seul runner auto-hébergé, partagé avec les déploiements : une jambe à la fois.
      max-parallel: 1
      matrix:
        consommateur: ${{ fromJSON(needs.consommateurs.outputs.liste) }}
    # max observé 15 s ; il clone un dépôt distant, donc il peut pendre au réseau.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lire le contrat épinglé
        id: contrat
        env:
          CLE_LECTURE: ${{ matrix.consommateur.secret && secrets[matrix.consommateur.secret] || '' }}
          NOM: ${{ matrix.consommateur.nom }}
          DEPOT: ${{ matrix.consommateur.depot }}
          CHEMIN: ${{ matrix.consommateur.chemin }}
          SECRET: ${{ matrix.consommateur.secret || '' }}
        # Valeurs de la liste passées par l'environnement, jamais interpolées dans le
        # script : une PR peut modifier la liste.
        run: scripts/lire-contrat-consommateur.sh "$NOM" "$DEPOT" "$CHEMIN" "$SECRET"

      - name: Confronter au contrat servi par la préproduction
        if: steps.contrat.outputs.lu == 'oui'
        env:
          NOM: ${{ matrix.consommateur.nom }}
          CONTRAT: ${{ steps.contrat.outputs.contrat }}
        run: |
          set -uo pipefail
          COULEUR="$(cat /etc/oto-mcp/active-canari)"
          case "$COULEUR" in
            blue)  PORT=9105 ;;
            green) PORT=9108 ;;
            *) echo "::error title=Couleur de préproduction inconnue::/etc/oto-mcp/active-canari dit « $COULEUR » — rien n'a été confronté."; exit 1 ;;
          esac
          echo "préproduction : couleur $COULEUR, port $PORT"
          code=0
          python3 scripts/contrat-front.py --consommateur "$NOM" \
            "$CONTRAT" "http://127.0.0.1:$PORT/api/openapi.json" || code=$?
          if [ "$code" = "2" ]; then
            echo "::error title=Contrat de $NOM — confrontation impossible::L'un des deux documents est illisible — le contrat N'A PAS été jugé."
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error title=$NOM va casser::Une opération qu'il épingle a disparu, changé d'entrée, ou ne rend plus ce qu'il lit. Garder la compatibilité, ou le prévenir AVANT la mise en production."
            exit 1
          fi

      - name: Effacer la clé de lecture
        if: always()
        env:
          TRAVAIL: ${{ steps.contrat.outputs.travail }}
        run: rm -rf "$TRAVAIL"

  # ─────────────────────────────────────────────────────────────────────────────
  # LE MÊME CONTRÔLE, MAIS AVANT LE DÉPLOIEMENT — une GARDE, pas un constat.
  #
  # Ce job-ci juge le contrat que CE CODE servirait, sans rien déployer : le document
  # est dérivé par simple import, sans serveur ni base, des routes que le serveur monte
  # (`server.routes_rest`, la source unique du montage). `OTO_BILLING_ENABLED=1` : la
  # préproduction et la production servent la facturation ; la dériver sans elle ferait
  # juger un document que personne ne sert (mesuré le 25/09 : 43 routes « disparues »
  # pour le dashboard, toutes servies).
  #
  # 21/09/2026 — il ne tournait QUE sur les PR, or le tronc reçoit ses commits par
  # poussée directe : il était `skipped` à chaque déploiement réel, et deux retraits de
  # champs lus par le front sont partis en préproduction puis en production sans
  # l'arrêter. Il tourne aussi sur la poussée, et `deploy-preprod` attend TOUTES ses
  # jambes ; la production, qui exige un run de préproduction vert sur son sha
  # (`scripts/garde_preprod_verte.py`), est gardée par ricochet.
  #
  # Mêmes règles de verdict : seule une rupture d'appel ou de lecture bloque. Un ajout
  # compatible sort en avertissement et n'empêche PAS de fusionner.
  #
  # #823 — SANS LE SECRET, IL ROUGIT. GitHub ne transmet pas les secrets à une PR venue
  # d'un fork : ce job y sortait VERT sans rien avoir jugé. Un « je n'ai pas pu juger »
  # est un résultat, distinct d'un « jugé conforme » : échec nommé. Ce rouge ne bloque
  # pas la fusion (aucun contrôle requis sur `main`) et ne demande rien au
  # contributeur : le même job rejuge le code, secret en main, à la poussée sur le tronc.
  contrat-front-code:
    name: Contrat avant déploiement — ${{ matrix.consommateur.nom }}
    needs: [consommateurs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consommateur: ${{ fromJSON(needs.consommateurs.outputs.liste) }}
    timeout-minutes: 10  # max observé 54 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install (deps + dev, par le verrou)
        uses: ./.github/actions/installer-par-le-verrou
        with:
          python-version: "3.12"
          extra: dev

      - name: Dériver le contrat que CE code servirait
        env:
          OTO_BILLING_ENABLED: "1"
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/openapi-de-la-pr.json
          import json
          from oto_mcp import openapi, server
          print(json.dumps(openapi.build(server.routes_rest(object()))))
          PY
          echo "contrat dérivé : $(wc -c < /tmp/openapi-de-la-pr.json) octets"

      - name: Lire le contrat épinglé
        id: contrat
        env:
          CLE_LECTURE: ${{ matrix.consommateur.secret && secrets[matrix.consommateur.secret] || '' }}
          EST_FORK: ${{ github.event.pull_request.head.repo.fork }}
          NOM: ${{ matrix.consommateur.nom }}
          DEPOT: ${{ matrix.consommateur.depot }}
          CHEMIN: ${{ matrix.consommateur.chemin }}
          SECRET: ${{ matrix.consommateur.secret || '' }}
        # Valeurs de la liste passées par l'environnement, jamais interpolées dans le
        # script : une PR peut modifier la liste.
        run: scripts/lire-contrat-consommateur.sh "$NOM" "$DEPOT" "$CHEMIN" "$SECRET"

      - name: Confronter
        if: steps.contrat.outputs.lu == 'oui'
        env:
          NOM: ${{ matrix.consommateur.nom }}
          CONTRAT: ${{ steps.contrat.outputs.contrat }}
        run: |
          set -uo pipefail
          code=0
          python3 scripts/contrat-front.py --consommateur "$NOM" \
            "$CONTRAT" /tmp/openapi-de-la-pr.json || code=$?
          if [ "$code" = "2" ]; then
            echo "::error title=Contrat de $NOM — confrontation impossible::Document illisible — le contrat N'A PAS été jugé."; exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error title=Ce code casserait $NOM::Une opération qu'il épingle disparaît, change d'entrée, ou ne rend plus ce qu'il lit. Garder la compatibilité, ou le prévenir AVANT de livrer."; exit 1
          fi

      - name: Effacer la clé de lecture
        if: always()
        env:
          TRAVAIL: ${{ steps.contrat.outputs.travail }}
        run: rm -rf "$TRAVAIL"
