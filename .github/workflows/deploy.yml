name: Deploy prod

# Modèle de release (ADR 0020, refonte 2026-07-20) : un TAG `v*` → PROD.
# main = tronc/preprod (deploy-canari.yml) ; la prod est un acte explicite = poser un
# tag `vX.Y.Z` sur le commit de main à promouvoir (`git tag vX.Y.Z && git push origin
# vX.Y.Z`). Le tag est passé au script serveur root-restreint /opt/deploy/oto-backend.sh
# (reset --hard <tag> + reinstall oto-core au tag pyproject + restart + healthcheck +
# rollback). Cf. ADR 0020.
#
# 08/10/2026 — LA SUITE COMPLÈTE TOURNE ICI, UNE SEULE FOIS (#1185).
# Du 08/09 au 08/10, ce workflow ne rejouait pas la suite : `scripts/garde_preprod_verte.py`
# réutilisait le verdict du job `test` de la préproduction, qui jouait la suite entière au
# même sha (100 mises en prod mesurées, 0 contradiction). La décision du 08/10 déplace la
# suite complète : au push sur `main`, `test` ne joue plus que les volets touchés et le
# socle de gardes (`scripts/selection_tests.py`, `tests/volets.toml`) ; la passe COMPLÈTE
# est celle-ci, au tag, et `deploy` l'attend. Le vert de préproduction reste exigé par la
# garde (déployée, sélection et socle verts), mais il ne vaut plus « suite complète ».
# Conséquence : la prod est servie après la durée de la suite, non plus ~1 min 30 après le
# tag. Cette suite est RÉPARTIE en parts parallèles (#1111, `suite-tests.yml` : plan par
# durées mesurées, parts à `-n` dérivé de leur machine, verdict qui rougit sur un test
# perdu) : ~3 min 30 à 4 min au lieu de ~9-14 min sur un seul runner. `test` n'est plus que
# l'agrégateur (le nom que `deploy` attend). « Une seule fois » : une relance « Re-run
# failed jobs » ne rejoue pas une part déjà verte, et `sans_garde_preprod` ne contourne QUE
# la garde, jamais cette suite. Les durées se régénèrent depuis l'artefact `suite-durees`
# d'un run complet vert (docs/commands.md §Suite parallèle en CI).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à déployer en prod (ex: v1.2.3)"
        required: true
      sans_garde_preprod:
        description: >-
          CONTOURNEMENT : déployer SANS exiger un run de préproduction vert sur ce sha.
        type: boolean
        default: false
  # Appelé par `release.yml`, qui pose la version puis déclenche le déploiement.
  # Nécessaire parce qu'un tag créé avec le GITHUB_TOKEN ne déclenche AUCUN
  # workflow (garde anti-récursion) : sans cet appel, la version serait posée et
  # rien ne partirait.
  workflow_call:
    inputs:
      tag:
        description: "Tag à déployer en prod"
        required: true
        type: string
      sans_garde_preprod:
        description: "CONTOURNEMENT : déployer sans exiger un run de préproduction vert."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Chaque job porte un `timeout-minutes` : sans lui, le défaut de GitHub est de SIX
  # heures. Le 07/09, un job de tests s'est suspendu sur un runner hébergé et n'a plus
  # rien écrit pendant 45 min, jusqu'à une annulation à la main. Hors suite complète
  # (`test`, plafonnée comme en préproduction), le déploiement tient en ~1 min 30 (garde
  # ~5 s, script bleu/vert 49-69 s dont 20 s d'attente que la nouvelle couleur soit
  # prête) : les plafonds ci-dessous laissent une marge très large et transforment une
  # pendaison silencieuse en échec visible en quelques minutes.

  # La syntaxe est vérifiée sur le Python du SERVEUR, pas sur celui de la CI.
  # Le 27/08, un boot preprod est mort sur « f-string expression part cannot include
  # a backslash » : légal en 3.12 (CI) et en 3.13 (poste), SyntaxError en 3.10 (box).
  # Ni les tests ni la CI ne pouvaient le voir — les deux tournaient sur un Python
  # plus récent que ce qui sert. `ast.parse(feature_version=(3,10))` ne l'attrape pas
  # non plus (vérifié : PEP 701 a changé le tokenizer, le drapeau ne le restaure pas),
  # donc il FAUT un vrai interpréteur 3.10. `compileall` suffit et coûte ~15 s : on ne
  # rejoue pas la suite, on vérifie que ça se COMPILE là où ça tournera.
  syntaxe-plancher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # DOIT rester égal au `requires-python` du pyproject ET à la box.
          python-version: "3.10"
      - name: Compiler sous le Python le plus ancien supporté
        run: python -m compileall -q oto_mcp

  # Le format du tag est validé AVANT qu'il serve de `ref:` (anti-injection : le ref/input
  # atterrit dans un `ref:` de checkout et une commande shell). Un job à part parce que
  # `suite`, appelé par `uses:`, ne peut pas porter d'étape : il reçoit la ref validée.
  tag:
    name: Valider le tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.valider.outputs.ref }}
    env:
      DEPLOY_REF: ${{ inputs.tag || github.ref_name }}
      REF: ${{ inputs.tag || github.ref }}
    steps:
      - id: valider
        name: Validate tag format
        run: |
          case "$DEPLOY_REF" in
            v[0-9]*) echo "tag ok: $DEPLOY_REF" ;;
            *) echo "tag invalide (attendu vX.Y.Z): $DEPLOY_REF" >&2; exit 1 ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  # La suite complète, sur l'arbre DU TAG, répartie en parts parallèles comme en
  # préproduction (`suite-tests.yml`, #1111) : cible vide.
  suite:
    needs: [tag]
    uses: ./.github/workflows/suite-tests.yml
    secrets: inherit  # DOCKERHUB_* facultatifs : le tirage de l'image PostgreSQL des tests
    with:
      ref: ${{ needs.tag.outputs.ref }}

  # Nommé exactement `test` : c'est le verdict que la prod attend (`deploy` le `needs`). Il
  # ne conclut `success` que si la suite entière a conclu `success` ; `always()` le fait
  # tourner aussi quand elle rougit, pour le dire — et pour le constat ci-dessous.
  test:
    needs: [tag, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: La suite complète a conclu « success »
        env:
          RESULTAT: ${{ needs.suite.result }}
        run: |
          if [ "$RESULTAT" != success ]; then
            echo "::error title=Suite complète : $RESULTAT::suite-tests.yml conclut « $RESULTAT » sur l'arbre du tag — le détail est dans ses jobs (suite / …)."
            exit 1
          fi
          echo "suite-tests.yml : success"
      # La mesure demandée par #1185 : un rouge vu ICI aurait-il été vu au push ? La
      # sélection est recalculée parent → sha (le push réel a pu porter d'autres commits :
      # c'est une approximation, dite comme telle dans le résumé). Un constat, pas une
      # garde : il ne change pas le verdict du job. Le rapport JUnit est celui de toutes
      # les parts, fusionné par l'agrégateur de `suite-tests.yml` (artefact `junit-suite`).
      - if: failure() && needs.tag.result == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          fetch-depth: 2  # le parent, pour le constat
      - if: failure() && needs.tag.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-suite
          path: ${{ runner.temp }}/junit-suite
      - name: Constat — ce rouge aurait-il filé avec la sélection ?
        if: failure() && needs.tag.result == 'success'
        continue-on-error: true
        run: |
          python3 scripts/selection_tests.py --base "$(git rev-parse HEAD^)" --tete HEAD \
            --constat "$RUNNER_TEMP/junit-suite/junit.xml"

  deploy:
    needs: [syntaxe-plancher, test]
    runs-on: [self-hosted, oto-platform]
    # reset + réinstall oto-core + restart + healthcheck (~60 s) + rollback éventuel.
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # Le jeton n'a besoin de rien d'autre : lire l'arbre, et lire les runs de la
    # préproduction. Déclaré ici plutôt que laissé au défaut du dépôt, pour que la
    # garde ne se mette pas à échouer en 403 le jour où ce défaut se resserre.
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      # Valide le format du tag AVANT tout usage (anti-injection : le ref/input
      # atterrit ensuite dans un `ref:` de checkout et une commande shell).
      - name: Validate tag format
        run: |
          case "$DEPLOY_REF" in
            v[0-9]*) echo "tag ok: $DEPLOY_REF" ;;
            *) echo "tag invalide (attendu vX.Y.Z): $DEPLOY_REF" >&2; exit 1 ;;
          esac

      # La garde vit dans le dépôt, donc il faut l'arbre. On extrait CELUI DU TAG :
      # la garde voyage avec ce qu'elle autorise. Ça ne déplace aucune confiance —
      # sur un `push` de tag, GitHub lit DÉJÀ ce fichier de workflow depuis le commit
      # tagué, donc qui peut pousser un tag contrôle déjà ce qui s'exécute ici.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # ─────────────────────────────────────────────────────────────────────────
      # LE VERDICT SE RÉUTILISE, IL NE SE REJOUE PAS.
      #
      # Exige un run de préproduction VERT sur le sha exact que ce tag désigne, et
      # refuse sinon — en nommant ce qu'il a lu (identifiant du run, date, conclusion
      # exacte). Un refus qui ne dit pas ce qu'il a constaté fait rejouer le même
      # geste ; celui-ci ferme la question.
      #
      # Il n'y a RIEN à créer côté préproduction : le run existe déjà sur chaque
      # poussée du tronc et porte le sha. Aucun tag, aucun artefact, aucune
      # publication de plus.
      #
      # ⚠️ LE CONTOURNEMENT, ET POURQUOI IL EXISTE. Une garde qui interroge l'API
      # des runs dépend de ce que l'API garde. Le jour où le run de préproduction
      # d'un commit a disparu — purge de rétention, run supprimé, incident côté
      # GitHub — la production serait bloquée par sa propre garde, au pire moment :
      # celui où l'on veut justement déployer un correctif. `sans_garde_preprod`
      # rouvre ce chemin. Il n'est PAS atteignable depuis une poussée de tag : il
      # faut un `workflow_dispatch` délibéré, donc quelqu'un qui l'a voulu, et le
      # journal garde qui a demandé quoi.
      - name: Cet arbre a déjà un verdict vert en préproduction
        if: ${{ inputs.sans_garde_preprod != true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/garde_preprod_verte.py "$DEPLOY_REF"

      - name: Contournement de la garde (demandé explicitement)
        if: ${{ inputs.sans_garde_preprod == true }}
        run: |
          echo "::warning title=Garde de préproduction CONTOURNÉE::Le déploiement de $DEPLOY_REF a été demandé SANS exiger un run de préproduction vert sur son sha. Aucune vérification n'a été faite sur l'arbre déployé. Qui l'a demandé est dans l'en-tête du run."

      - name: Deploy prod (build serveur via script root-restreint)
        # Runner self-hosted sur la box dédiée (sudo NOPASSWD limité à
        # /opt/deploy/oto-backend.sh). Le tag validé est passé en argument via env.
        run: |
          case "$DEPLOY_REF" in
            v[0-9]*) : ;;
            *) echo "tag invalide: $DEPLOY_REF" >&2; exit 1 ;;
          esac
          sudo /opt/deploy/oto-backend.sh "$DEPLOY_REF"
