    # Le verrou est versionné et la CI installe par `uv sync --frozen` : les bornes
    # ci-dessous disent ce que le code ACCEPTE, le verrou dit ce qui est INSTALLÉ.
    # Tout changement de ce manifeste (pin oto-core compris) se fait avec `uv lock`
    # dans le même commit — la CI refuse un verrou en retard (`uv lock --check`).
    # Avant lui, `pip install -e .` dans un venv existant ne mettait jamais à jour une
    # dépendance satisfaite : chaque couleur gardait ce qu'elle avait résolu le jour
    # de sa création (mesuré le 11/09 : production en 3.4.2, attente en 3.4.7), et le
    # plancher était le seul levier qui atteignait la production. Cf.
    # docs/verrou-dependances.md.
