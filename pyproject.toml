    # classe d'erreur, un tiers a cessé de fournir `httpx`, puis `fastmcp` a
    # réorganisé ses modules internes (`fastmcp.tools.tool` a disparu). À chaque
    # fois la CI est tombée sur TOUTES les branches à la fois, pendant que les
    # environnements locaux — installés plus tôt, donc plus anciens — restaient
    # verts. Un projet qui déclare `>=X` sans plafond n'est pas reproductible : sa
    # vérification dépend du jour où elle tourne.
    # Le plafond ne gèle rien : il rend la montée de version DÉLIBÉRÉE — on l'essaie,
    # on lance la suite, on borne plus haut. Extra `apps` = prefab_ui (MCP Apps
