[project]
name = "oto-mcp"
version = "0.1.0"
description = "MCP server exposing selected oto-cli connectors as tools (Streamable HTTP, OAuth 2.1)."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # ⚠️ **Plancher ET PLAFOND.** « Plancher = dernier », sans borne haute, s'est
    # retourné trois fois dans la même soirée (31/08/2026) : le SDK a renommé sa
    # classe d'erreur, un tiers a cessé de fournir `httpx`, puis `fastmcp` a
    # réorganisé ses modules internes (`fastmcp.tools.tool` a disparu). À chaque
    # fois la CI est tombée sur TOUTES les branches à la fois, pendant que les
    # environnements locaux — installés plus tôt, donc plus anciens — restaient
    # verts. Un projet qui déclare `>=X` sans plafond n'est pas reproductible : sa
    # vérification dépend du jour où elle tourne.
    # Le plafond ne gèle rien : il rend la montée de version DÉLIBÉRÉE — on l'essaie,
    # on lance la suite, on borne plus haut. Extra `apps` = prefab_ui (MCP Apps
    # SEP-1865) consommé par les tools *_app. Schéma plat des tools validé sur 3.4
    # (ADR 0009).
    "fastmcp[apps]>=3.4.2,<3.5",
    # lib connecteurs (oto.tools) — PLUS de dép à la CLI (otomata#13). PINNÉ sur un
    # tag git (≠ @main flottant) : une version déployée = une coordonnée reproductible
    # (SHA backend + ce pin). PyPI ne reçoit pas chaque merge (publish manuel, lag) →
    # on tague oto-core et on bump CE pin par PR. Bump = éditer le tag ici ; rollback
    # = revert ce commit (ramène aussi le bon oto-core). Cf. ADR 0020 (deploy/canari).
    # ⚠️ EXCEPTION — une PR venue d'un FORK bumpe le pin SUR LE TRONC, pas dans la
    # branche : on n'écrit pas dans le dépôt d'autrui (l'API Contents rend 404 dessus).
    # Le mainteneur bump ici, puis `update-branch` la PR. L'atomicité du revert cède
    # devant ça. Cf. docs/contributions-forks.md (amendement du 2026-09-01).
    # v1.110.0 = calendar : `update_event` (PATCH, jamais `update` — remplacer
    # effacerait invités, récurrence, rappels et lien de visio, donc une faute de
    # frappe annulerait la réunion) et `delete_event`, qui RELIT l'événement avant de
    # le retirer pour rendre ce qu'il a supprimé (l'API répond 204 sans corps : sans
    # ça, supprimer le mauvais id donne la même réponse que supprimer le bon).
    # `send_updates` est passé explicitement, défaut « none » — corriger une coquille
    # ne doit pas écrire à douze personnes, et un défaut d'API qu'on ne contrôle pas
    # peut changer. Un patch vide est refusé plutôt que joué. Signal #686 : « un outil
    # qui écrit sans pouvoir défaire pousse à laisser des traces derrière soi » ;
    # v1.109.0 = unipile : un enrichissement de noms d'interlocuteurs qui n'a PAS eu
    # lieu se dit (`attendee_names`: `unavailable` | `partial`, avec les ids manquants
    # et le repli à faire), au lieu de partir en `logger.warning` côté serveur pendant
    # que l'appelant lit une liste muette. Signal #682 : sur ~40 fils, l'agent a conclu
    # que « l'enrichissement annoncé dans la doc n'apparaît pas » sans pouvoir
    # distinguer une panne d'un carnet incomplet. Le pire cas n'est pas la panne mais
    # la résolution PARTIELLE, qui rend une liste hétérogène où l'absence de nom se lit
    # « pas d'interlocuteur ». Rien n'est dit quand tout est résolu (une page pèse déjà
    # ~105 Ko). Classe oto#42 ;
    # v1.108.0 = serper : le SCRAPE attend 15 s au lieu de 60, et `timeout_s` (1-60,
    # borné) laisse l'appelant serrer. p95 mesuré à 61,6 s sur 193 passages d'agents,
    # 58 expirations à 60 s — et ce qui coûte n'est pas l'attente mais ce qu'elle
    # emporte : le cache de contexte de l'agent expire pendant, le passage médian ayant
    # scrapé coûtant 72 077 jetons contre 35 798 sans. Le reste du client garde son
    # délai : une recherche n'a pas le profil d'une extraction (oto-backend#662) ;
    # v1.107.0 = TROIS clients neufs (oto-core#76) : `github` (REST v3 — dépôts et
    # code, issues, PR et revues, organisations et équipes, Actions, recherche),
    # `leexi` (intelligence conversationnelle — appels, transcripts, notes, réunions)
    # et `productlane` (retours clients, roadmap adossée à Linear, changelogs, centre
    # d'aide). Chacun porte le relevé des divergences SILENCIEUSES de son API : les
    # filtres multi-valués de Leexi qui exigent `nom[]=` sous peine d'être réduits à
    # leur dernière valeur (Rails) ; la pagination par curseur de Productlane, dont
    # une page intermédiaire peut être VIDE avec `has_more` vrai ; et chez GitHub le
    # `per_page` raboté sans erreur au-delà de 100, les listes qui sont des OBJETS
    # (`items`, `workflow_runs`, `jobs`), les 204/404 sans corps qui valent oui/non,
    # et le 403 qui ne se retente que s'il porte la marque d'une limite d'usage.
    # Aucune écriture n'est retentée dans les trois : aucune de ces API n'a de clé
    # d'idempotence, et un rejeu créerait un doublon (une issue, un utilisateur
    # facturé, ou une diffusion de changelog envoyée DEUX fois) ;
    # v1.105.0 = hubspot : `batch_read_objects` lit jusqu'à 100 fiches en UN appel
    # (tranché par le client) au lieu d'un GET par id, et rend une ENVELOPPE
    # `{results, missing_ids}` dont les deux clés sont toujours là — `missing_ids` est
    # le SEUL endroit où une page rétrécie s'annonce, HubSpot répondant 207 et non une
    # erreur pour un id supprimé ou archivé. Le 429 est désormais rattrapé, borné en
    # DURÉE et partagé par toutes les tranches d'une même opération ; un 5xx ne l'est
    # PAS (un 429 dit que la requête a été refusée, la rejouer est sans effet de bord ;
    # rejouer un POST sur un 502 créerait un doublon dans un CRM). ⚠️ Cela change le
    # TEMPS D'ÉCHEC de tous les appels du client hubspot : le même refus 429 nommé peut
    # mettre ~110 s au lieu de ≤ 30 s (oto-core#74, sert oto-backend#803) ;
    # v1.104.0 = minari : MinariClient (oto.tools.minari), prospection téléphonique —
    # journal d'appels transcrits, listes CSV, analytics d'équipe, écrit sur le contrat
    # OpenAPI publié sans sonde live (oto-core#67, sert oto-backend#699) ; hubspot : les
    # listes (= les segments) et le référentiel des propriétés, 21 méthodes ajoutées au
    # client (oto-core#72, sert oto-backend#745) ; kaspr : un `dataToGet` inconnu est
    # refusé ICI en nommant les valeurs acceptées, au lieu de partir sur le fil, la liste
    # de référence étant l'enum de Kaspr et non notre docstring (oto-core#73) ;
    # v1.103.0 = slack : un jeton PUREMENT numérique entre deux `:` n'est plus lu comme
    # un emoji (une heure « 20:02 to 20:51 » se faisait avaler ses chiffres, signaux
    # #711/#575) et un texte au-delà des 4 000 caractères recommandés est SPLIT en
    # plusieurs messages threadés rendant tous leurs `ts` (`ts_all`) plutôt que tronqué
    # en silence par Slack à 40 000 (#711/#613) ; notion : `search_edited_on` — /search
    # ne FILTRE pas sur last_edited_time (axe de TRI seulement), on pagine trié
    # décroissant et on s'arrête à la première page plus vieille, donc « rien n'a changé »
    # redevient calculé et non inféré (#468/#469 — câblage MCP côté ici encore à faire) ;
    # secrets : un `secret_provider` CONFIGURÉ dont le magasin est absent avertit une fois
    # par process au lieu de résoudre tous les secrets à leur défaut (constaté en prod le
    # 28/08), et un nom de fournisseur inconnu LÈVE au lieu de retomber sur `file` ;
    # v1.102.0 = DEUX clients d'un coup, un seul tag : lemlist couvre l'API entière
    # (141 routes — le client savait lire une campagne, pas en conduire une,
    # oto-core#65) et tally arrive complet (38 opérations sur les formulaires,
    # version d'API datée épinglée côté client, oto-core#66) ;
    # v1.101.0 = serper : le refus LinkedIn de scrape_page ne prescrit plus un outil MCP (#632, 30/08/2026).
    # v1.100.0 = slack : lecture des RÉPONSES d'un fil (conversations.replies —
    # signaux #567/#576/#584/#592, quatre en huit jours : history ne rend que le
    # premier niveau, donc une décision prise dans un fil était invisible),
    # adhésion aux canaux PUBLICS (conversations.join, moitié automatisable du
    # #549) + channel_info pour refuser un canal privé sans faire semblant, et
    # `needed`/`provided` portés par SlackError (Slack nomme le scope manquant,
    # on cessait de le relayer) ;
    # v1.99.0 = fenêtre de lecture sur les listings attio et linear (signaux #586,
    # #597, #561, #568) : notes paginables (limit/offset — on ne voyait que les dix
    # plus ANCIENNES), tâches paginables et triables, réunions au CURSEUR avec
    # ends_from/starts_before ; issues Linear bornables en date côté serveur, ordre
    # déclaré. Emporte deux paramètres qui ne filtraient RIEN : attio envoyait
    # `completed` (Attio attend `is_completed`) et un `offset` inexistant sur
    # /meetings ;
    # v1.98.0 = serpapi : un résultat VIDE n'est plus resservi par un cache (signal
    # d'usage #456 — un zéro mémorisé une heure devenait une absence fausse et
    # permanente sur un indicateur d'activité) ; emporte aussi le retrait de
    # keep_client, orphelin et sans consommateur ici ;
    # v1.97.0 = unipile (13 modules) et slides (9 modules) découpés, surface figée (oto-core#62)
    # v1.96.1 = retouches revue oto-core#61 : timeout (10, 60) sur le transport folk
    # (il n'en avait AUCUN — un host injoignable tenait la mono-loop) + garde
    # intra-entrée assigned_users (id ET email dans un même dict = 422 opaque) ;
    # v1.96.0 = folk interactions EN LECTURE (past/upcoming/get/update/delete) +
    # collection tasks, successeur des reminders que Folk a dépréciés le 13/08/2026 —
    # le connecteur affirmait qu'on ne pouvait relire QUE la date d'un échange, pas son
    # contenu : faux de lui, pas de Folk. Corrige deux bugs PRÉEXISTANTS trouvés en live
    # (dateTime requis par create_interaction, entity requis dans le PATCH d'une
    # interaction — 422 opaques jusque-là), oto-core#61 ;
    # v1.95.0 = tavily (recherche web + extract/crawl/map — oto-core#59) + waalaxy
    # builder pur / 2xx non-JSON typé (oto-core#60) + connect borné 10 s tavily —
    # UN seul tag pour les deux connecteurs, aucun ordre de merge ne fait régresser ce pin ;
    # v1.94.0 = waalaxy (prospection LinkedIn, API import-only : listes, campagnes,
    # import de prospects — oto-core#58) + timeout du client ;
    # v1.93.0 = lemlist enrichissement (email/téléphone/LinkedIn, jobs async,
    # oto-core#56) + airtable Base data API (oto-core#57) + fix bool query string —
    # UN seul tag pour les deux connecteurs, aucun ordre de merge ne fait régresser ce pin ;
    # v1.92.0 = snitcher (identification des visiteurs du site web : workspaces,
    # organisations, contacts, sessions, champs personnalisés — oto-core#55) ;
    # v1.91.0 = stripe coupons + codes promo (create/update — catalogue, toujours
    # aucune méthode qui déplace de l'argent, oto-core#54) ;
    # v1.90.0 = apollo contacts : catalogue des champs personnalisés, recherche des
    # contacts DE L'ÉQUIPE, lecture et PATCH d'un contact (0 crédit chacun). Ouvre
    # l'écriture d'une variable d'outreach par lead avant enrôlement en séquence.
    # v1.89.0 = clients stripe (facturation du client) et posthog (analytique produit) ;
    # v1.88.0 = clients forager (offres d'emploi, fiches d'organisation) et linear
    # (issues, projets) — un seul tag pour les deux (oto-core#50/#51) ;
    # ⚠️ ces deux clients (v1.89.0) :
    # attendus par un tenant tiers — UN seul tag pour les deux, pour qu'aucun ordre de merge
    # ne fasse régresser ce pin. ⚠️ Ces deux clients n'ont, DÉLIBÉRÉMENT, aucune
    # méthode qui déplace de l'argent (remboursement, virement, clôture de litige,
    # résiliation) ni qui change le produit (bascule de feature flag, suppression de
    # personne) : l'absence est la garde, pas un choix de la couche tool — la rendre
    # possible demande une PR oto-core. Deux tests figent ces absences des deux côtés.
    # v1.87.0 = SEPT clients d'un coup (oto-core#43-49) : apollo séquences/emails/
    # conversations, ahrefs v3, webflow CMS+webhooks, promptwatch, granola, grain,
    # fireflies — un seul tag pour les sept, aucun ordre de merge des PR backend ne
    # peut donc faire régresser ce pin ; v1.86.0 = lightfield send_email/draft_email ;
    # v1.85.0 = gmail reply/draft_reply vers PLUSIEURS destinataires : la résolution
    # ne lisait qu'une adresse et rendait vide sur une liste, donc `gmail_reply` sur un
    # fil à deux personnes ne partait nulle part (vécu 19/08/2026) ; v1.84.0 = client
    # Lightfield (CRM agent-native), aucun connecteur ne l'appelle encore ;
    # v1.83.0 = folk groupes (create/update, champs personnalisés de groupe, membres,
    # oto-core#39) + clients TheirStack & Origami (prospection sortante, oto-core#40) :
    # UN seul tag pour les deux, pour qu'aucun ordre de merge ne fasse régresser ce pin ;
    # v1.82.0 = `UnipileClient.delete_account` : le seul geste qui LIBÈRE un siège (un
    # compte facture tant qu'il existe sur l'instance — se déconnecter côté oto ne le rend
    # pas) ; v1.81.0 = la messagerie Unipile route par PROVIDER (inbox LinkedIn vs plate) : les
    # cinq canaux sans inbox (whatsapp/telegram/instagram/messenger/twitter) rendaient un
    # 501 amont sur `op="list"` depuis la bascule inbox faite en dur pour LinkedIn ;
    # v1.78.0 = apollo search_people person_locations/organization_locations (un domaine
    # est mondial : isoler la filiale FR, signaux #354/#356) ;
    # v1.77.0 = gmail (en-têtes canoniques To/Cc/Subject + relecture insensible à la
    # casse + markdown rendu en BROUILLON, signaux #340/#341/#342/#343) et sirene stock
    # (`[ND]` non diffusible ne tue plus le scan, #358) ;
    # v1.75.0 = LushaClient.search_and_enrich (search + reveal emails/phones,
    # 100 contacts max par appel) ; v1.74.0 = salesforce create_records/update_records (bulk via sObject
    # Collections, 200 max par appel) ; v1.73.0 = SellsyClient (CRM + gestion
    # commerciale FR, client_credentials) ;
    # v1.72.0 = FirecrawlClient + ApifyClient (scraping : page en markdown, actors
    # hébergés) ; v1.71.0 = lemlist create/launch lead + variables, checkcrm filiales par
    # slug/nom, folk webhooks — un SEUL tag pour les trois PR (oto-core#30/#31/#32),
    # même motif que v1.61.0 ci-dessous : aucun ordre de merge ne peut faire
    # régresser ce pin ; v1.62.0 = SpottClient (ATS/CRM recrutement) ; v1.61.0 = CheckCrmClient
    # (job-change check) + DropcontactClient (enrichissement
    # bulk async) — un SEUL tag pour les deux, pour qu'aucun ordre de merge des PR
    # backend ne puisse faire régresser ce pin.
    # ⚠️ `checkcrm` est RETIRÉ depuis le 2026-09-02 (backend + oto-core) : les deux
    # raisons ci-dessus qui le nomment (v1.71.0, v1.61.0) ne tiennent plus le
    # plancher. Ce qui le tient encore : lemlist/folk pour v1.71.0,
    # DropcontactClient pour v1.61.0.
    # v1.22.0 = AiArkClient (oto.tools.aiark,
    # requalification mount→API #160) ; v1.19.0 = serper reviews_all (recensement avis,
    # ADR 0045 B2) ; v1.18.0 = serper census_maps (ADR 0045 B1 — ⚠️ le pin avait régressé
    # à v1.17.0 via un commit concurrent, v1.19.0 le restaure) ; v1.17.0 = fixes Unipile
    # API v2 ; v1.15.0 = cursor limit override unipile_relations (#179) ; 1.14 = status_code.
    "oto-core[anonymize] @ git+https://github.com/otomata-tech/oto-core.git@v1.116.0",
    # Patchright = client CDP qui pilote le Chrome HÉBERGÉ Browserbase (connect_over_cdp)
    # pour les connecteurs d'API privée cookie-bound (tools/brevo.py, tools/crunchbase.py).
    # AUCUN browser local sur la box (connect_over_cdp ne lance rien → pas de binaire Chrome
    # requis). Déclaré en DIRECT car le backend n'utilise PAS o-browser (la lib de Chrome
    # LOCAL) : on a donc retiré l'extra `browser` d'oto-core, qui ne servait qu'à tirer
    # patchright transitivement (via o-browser). Le CLI local, lui, garde oto-core[browser].
    "patchright>=0.1.0",
    # Détection des callbacks qui bloquent l'event loop (gel du serveur mono-loop,
    # vécu 2026-07-02) — la détection native asyncio-debug sans son overhead ;
    # consommé par oto_mcp/loop_watch.py (warn journal ≥1s, event Sentry ≥10s).
    "aiodebug>=2.3.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    # Les DEUX clients HTTP du dépôt, importés au top-level par du code SERVI —
    # `requests` par les flux OAuth et la Management API, `httpx` par le client de
    # paiement, l'extraction de fichiers et l'email. Ils arrivaient jusqu'ici en
    # transitives, derrière des paquets qui ne les promettent pas : le 31/08/2026,
    # l'un d'eux a cessé de fournir `httpx` et TOUTE la CI est tombée, sur toutes les
    # branches à la fois, pendant que les environnements locaux restaient verts.
    # Ce qu'on IMPORTE, on le DÉCLARE — garde-fou `tests/test_dependances_declarees.py`.
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    # `oto.tools.google.credentials` importe `google_auth_oauthlib` au top-level
    # (InstalledAppFlow). Vit dans l'extra `google` d'oto-core, NON tiré par
    # `oto-core[anonymize]` → drive_*/gmail_* crashent en prod
    # ('No module named google_auth_oauthlib'). Même cas que `markdown` ci-dessous.
    "google-auth-oauthlib>=1.0",
    # Rendu markdown→HTML des gmail_* (défaut markdown=True). Vit dans l'extra
    # `google` d'oto-cli, mais le serveur installe `oto-cli[browser]` → on le
    # déclare ici pour qu'il soit installé par le `pip install -e .` du deploy
    # (oto-mcp#17 : crash 'No module named markdown' en prod).
    "markdown>=3.5",
    # Rendu markdown→HTML SÛR (html=False) des pages de partage server-rendered
    # (public_doc_page.py, /p/d/<token>). Aujourd'hui tiré transitivement (rich) ;
    # déclaré direct car on en dépend au runtime d'une route publique.
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "croniter>=2.0",           # déclencheurs du runner (R3) : next_due depuis le cron, dans le fuseau du déclencheur
    # france-opendata : plus de dép DIRECTE (ADR 0028 extraction totale — foncier/fr/
    # urba/sante/frenchtech + SIRENE/DILA/BOAMP/ACCO passent tous par le service FOD).
    # Reste tirée TRANSITIVEMENT par oto-core (>=0.7.0, base sans extras) pour le seul
    # SireneClient keyé INSEE, qui reste in-process (FOD ne porte aucun credential).
    # Le backend n'exécute plus AUCUN DuckDB in-process → extras [stock,sante] retirés.
    "cryptography>=42",
    "boto3>=1.34",  # upload avatars/logos → Scaleway Object Storage (S3-compatible)
    "python-multipart>=0.0.9",  # parsing multipart des uploads (Starlette request.form())
    "sentry-sdk[starlette]>=2.0",  # error tracking SaaS (gaté OTO_SENTRY_DSN) : 500 REST via intégration Starlette + exceptions tools MCP via middleware (sentry_setup.py)
    # Extraction du TEXTE des fichiers déposés (#298) — rendre cherchable ce qu'un
    # fichier CONTIENT, pas seulement son nom. Trois critères tenus, et ce sont eux
    # qui bornent la famille : **pur Python** (aucun binaire système à installer sur
    # la box — pas de LibreOffice, pas de tesseract), **licence permissive**
    # compatible MIT (BSD-3 / MIT / MIT), **maintenue**. Un format qui exigerait un
    # binaire n'est pas ajouté : il est déclaré NON SUPPORTÉ, ce qui est honnête et
    # ne fait pas grossir l'image.
    # ⚠️ Pas d'OCR : lire une image est un autre métier et un autre coût.
    "pypdf>=6.0",          # PDF
    "python-docx>=1.1",    # .docx
    "openpyxl>=3.1",       # .xlsx
]

[project.optional-dependencies]
# NB : plus AUCUNE dépendance vers du code client (ex-extra `mm`) — les
# connecteurs client-sensibles sont des bridges distants consommés par le
# middleware générique tools/remote.py (ADR 0003, meta-repo otomata).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
# Aiguillage : nu → le serveur ; `maintenance <travail>` → oto_mcp.maintenance.
# Il passe par `oto_mcp.cli` et non par `oto_mcp.server` parce qu'importer ce
# dernier construit une instance MCP complète au niveau module (ADR 0065).
oto-mcp = "oto_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oto_mcp*"]
