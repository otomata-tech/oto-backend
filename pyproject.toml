    # trousseau JWKS faisait rejeter TOUS les jetons** par `JWTVerifier`, y compris
    # ceux signés par une clé supportée du même trousseau — `_jwk_to_pem` levait dans
    # la boucle de remplissage du cache et perdait le trousseau entier. Éprouvé sur
    # les deux versions : trousseau à une clé EC → accepté des deux côtés ; le même
    # plus une clé Ed25519 → REFUSÉ en 3.4.2, accepté en 3.4.7 ; jeton d'une clé
    # étrangère → refusé des deux côtés. `auth.oto.cx/oidc/jwks` ne sert aujourd'hui
    # qu'une clé (EC/ES384) : la panne d'authentification est LATENTE, elle part le
    # jour où le fournisseur d'identité publie une clé EdDSA. Ce plancher ne touche
    # PAS `mcp` (non déclarée, tirée par fastmcp en `>=1.24,<2.0`) : aucun des
    # comportements de transport de mcp 1.30.0 n'arrive avec lui.
