# ─────────────────────────────────────────────────────────────────────────────
# Fichiers sans effet sur le code servi : la mention de leur nom par un test suffit à le
# jouer (étape 4), le socle tourne toujours.
[[volet]]
nom = "documentation"
sources = [
  "docs/**",
  "*.md",
  "LICENSE",
  ".gitignore",
  ".dockerignore",
  ".env.example",
  "Dockerfile",
]
tests = ["tests/test_docs.py", "tests/test_readme_droit_declare.py"]

[[volet]]
nom = "scripts d'exploitation"
# Un script est joué par les tests qui le citent (étape 4).
sources = ["scripts/**"]
tests = []

[[volet]]
nom = "déploiement"
sources = ["deploy/**", "tests/deploy/**"]
tests = ["tests/deploy/test_*.py"]

[[volet]]
nom = "contrats figés"
sources = [
  "tests/schema_gele/**",
  "tests/*.txt",
  "tests/*.json",
  "tests/api/*.txt",
  "tests/canari/**",
  "tests/fixtures/**",
]
tests = ["tests/test_schema_assembly_frozen.py", "tests/test_db_surface_frozen.py"]

[[volet]]
nom = "sélection des tests"
sources = ["scripts/selection_tests.py", "tests/volets.toml"]
tests = ["tests/test_selection_tests.py"]

# ─────────────────────────────────────────────────────────────────────────────
# LES CONNECTEURS. `{nom}` parcourt les fournisseurs (`oto_mcp/providers/*.py`) et les
# fiches (`oto_mcp/connectors/docs/*.md`).
