# Table « fichier → volet » de la sélection au push (#1185, décision du 08/10/2026).
#
# Au push sur `main`, la CI ne joue que les volets touchés par le diff, PLUS le socle de
# gardes transverses ; la suite complète tourne une seule fois, au tag, avant la prod.
# Lue par `scripts/selection_tests.py`, vérifiée par `tests/test_selection_tests.py`.
#
# Ce qu'un fichier modifié déclenche, dans l'ordre :
#   1. il tombe dans `[complete]`            → suite complète ;
#   2. c'est un fichier de test               → il est joué ;
#   3. il tombe dans un volet (ou la famille) → les tests du volet, PLUS tous les tests qui
#      importent directement un module du volet ;
#   4. toujours, en plus : les tests qui importent directement le module modifié, et ceux
#      dont le texte cite son nom de fichier (`http.py`, `api_routes_table.txt`…) ;
#   5. il ne tombe nulle part                 → suite complète (jamais de trou silencieux).
#
# Globs : `*` ne franchit pas `/`, `**` franchit tout. `{nom}` (famille) = un connecteur.
# Un fichier d'`oto_mcp/` absent de cette table fait rougir `test_selection_tests.py` :
# le ranger dans un volet, ou dans `[complete]` s'il est transverse. Dans le doute,
# `[complete]` : un volet faux laisse filer un rouge jusqu'au tag.

# Au-delà de cette part des fichiers de tests, la sélection ne fait plus gagner assez :
# suite complète.
seuil_part = 0.5

# ─────────────────────────────────────────────────────────────────────────────
# LE SOCLE : joué à CHAQUE push, quel que soit le diff. Ce sont les gardes transverses
# dont un rouge naît loin du fichier modifié (constat du 01/10, #1111) : sortie déclarée
# des capacités, façade d'erreur MCP, contrat servi aux consommateurs (OpenAPI, table de
# routes), concordance carte/client, gardes de portée, inventaire d'env, doc_lint,
# silences, SQL hors de la boucle, surfaces figées. ~30 s sur 4 workers, sans base.
[socle]
tests = [
  "tests/test_capability_outputs.py",
  "tests/test_sorties_listes_projetees.py",
  "tests/test_mcp_errors_facade.py",
  "tests/test_attempt_errors_traverse_le_contrat.py",
  "tests/test_openapi.py",
  "tests/test_openapi_sections_330.py",
  "tests/test_contrat_front.py",
  "tests/test_contrat_consommateurs_966.py",
  "tests/api/test_api_routes_table_frozen.py",
  "tests/auth/test_facade_routes_table_frozen.py",
  "tests/test_tenant_defini_dans_le_contrat_775.py",
  "tests/api/test_routes_lourdes_declarees_1145.py",
  "tests/test_tools_client_methods_exist.py",
  "tests/test_card_client_required_agree.py",
  "tests/test_portee_une_seule_definition.py",
  "tests/test_owner_scope_tripwire.py",
  "tests/test_search_scope_tripwire.py",
  "tests/test_env_inventory_complet.py",
  "tests/test_doc_lint.py",
  "tests/test_no_silent_except.py",
  "tests/test_db_hors_boucle.py",
  "tests/test_lot1_sql_hors_boucle.py",
  "tests/test_capacites_hors_boucle.py",
  "tests/test_db_surface_frozen.py",
  "tests/test_schema_assembly_frozen.py",
  "tests/test_access_surface_frozen.py",
  "tests/test_org_store_surface_frozen.py",
  "tests/test_tenant_ne_s_etend_plus.py",
  "tests/test_selection_tests.py",
]

