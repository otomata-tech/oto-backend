  "oto_mcp/api/{nom}_*.py",
  "oto_mcp/capabilities/{nom}_connect.py",
  "oto_mcp/fod/{nom}.py",
]
tests = [
  "tests/**/test_{nom}.py",
  "tests/**/test_{nom}_*.py",
  "tests/**/test_sonde_{nom}.py",
  # Le registre et les fiches se jugent ensemble.
  "tests/connectors/test_*.py",
]

